    <div id="root">
      <div class="fallback">
        <div>

          <p>실제 앱은 START_YEON_DEV.bat 또는 빌드된 설치 파일로 실행해 주세요.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

</html>
